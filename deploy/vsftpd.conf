# vsftpd Configuration for Inventario Eraginkorra
# FTP seguro con certificados autofirmados y usuario anónimo

# --- Configuración básica ---
listen=YES
listen_ipv6=NO

# --- Usuarios ---
anonymous_enable=YES
local_enable=YES
write_enable=YES

# --- Usuario anónimo: solo /srv/ftp/public ---
anon_root=/srv/ftp/public
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_other_write_enable=NO
no_anon_password=YES

# --- Usuario frontuser: chroot a /var/www/frontend ---
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/www/frontend
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO        # zerrendan gsonituenak onartzen ditu

# --- Modo pasivo ---
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
port_enable=YES

# --- TLS/SSL (FTPS Explicit) ---
ssl_enable=YES
rsa_cert_file=/etc/vsftpd/vsftpd-talde4.crt
rsa_private_key_file=/etc/vsftpd/vsftpd-talde4.key
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=NO
ssl_ciphers=HIGH

# --- Logs ---
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log

# --- Umask paraanonimos ---
anon_umask=077