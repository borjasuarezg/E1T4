<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelak — Inbentarioa</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/toast.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="tag">INV-01</span><h1>Inbentarioa</h1></div>
    <nav class="nav">
      <a href="index.html">Ekipamendua</a>
      <a href="etiquetas.html">Etiketak</a>
      <a href="gelas.html" class="active">Gelak</a>
      <a href="compras.html">Erosketak</a>
      <a href="usuarios.html" id="navUsuarios" hidden>Erabiltzaileak</a>
    </nav>
    <div class="user-box" id="userBox">
      <strong id="userName">—</strong>
      <span class="role-badge" id="userRole">—</span>
      <p style="margin-top:10px"><a href="#" id="logoutLink">Saioa itxi</a></p>
    </div>
  </aside>

  <main>
    <div class="page-head">
      <div><h2>Gelak</h2><p>Ikasgelak eta espazioak</p></div>
      <button type="button" class="btn btn-amber" id="btnNuevaGela">+ Gela berria</button>
    </div>

    <table class="inventory">
      <thead><tr><th>Izena</th><th>Taldea</th><th>Akzioak</th></tr></thead>
      <tbody id="tbodyGelas"><tr><td colspan="3" style="color:var(--text-mute)">Kargatzen…</td></tr></tbody>
    </table>

    <div class="form-card" id="formGela" style="display:none; margin-top:24px;">
      <h3 style="margin-top:0">Gela berria</h3>
      <form id="gelaForm" novalidate>
        <div class="field">
          <label for="nombre">Izena *</label>
          <input type="text" id="nombre" required>
          <div class="error">Gelaren izena beharrezkoa da.</div>
        </div>
        <div class="field"><label for="taldea">Taldea</label><input type="text" id="taldea"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Gorde</button>
          <button type="button" class="btn btn-ghost" id="btnCancelarGela">Utzi</button>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="js/base.js"></script>
<script src="js/api.js"></script>
<script src="js/validate.js"></script>
<script src="js/gelas.js"></script>
</body>
</html>
