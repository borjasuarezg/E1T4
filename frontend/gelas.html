<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelak — Inbentario eraginkorra</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="tag">INV-01</span><h1>Inbentarioa</h1></div>
    <nav class="nav">
      <a href="index.html">Ekipamendua</a>
      <a href="etiquetas.html">Etiketak</a>
      <a href="gelas.html" class="active">Gelak</a>
      <a href="compras.html">Erosketak</a>
      <a href="usuarios.html" id="navUsuarios" hidden>Erabiltzaileak</a>
    </nav>
    <div class="user-box" id="userBox">
      <strong id="userName">—</strong>
      <span class="role-badge" id="userRole">—</span>
      <p style="margin-top:10px"><a href="#" id="logoutLink">Saioa itxi</a></p>
    </div>
  </aside>

  <main>
    <div class="page-head">
      <div><h2>Gelak</h2><p>Biltegia, mintegia eta gainerako gelak</p></div>
      <button class="btn btn-amber" id="btnNuevaGela">+ Gela berria</button>
    </div>

    <table class="inventory">
      <thead><tr><th>Izena</th><th>Mota</th><th>Kokapen fisikoa</th><th></th></tr></thead>
      <tbody id="tbodyGelas"><tr><td colspan="4" style="color:var(--text-mute)">Kargatzen…</td></tr></tbody>
    </table>

    <div class="form-card" id="formGela" style="display:none; margin-top:24px;">
      <h3 style="margin-top:0">Gela berria</h3>
      <form id="gelaForm" novalidate>
        <div class="field" id="f_nombre"><label for="nombre">Izena *</label>
          <input type="text" id="nombre" required>
          <div class="error">Izena beharrezkoa da.</div></div>
        <div class="field"><label for="tipo">Mota</label>
          <select id="tipo"><option value="biltegia">Biltegia</option><option value="mintegia">Mintegia</option><option value="beste" selected>Beste</option></select></div>
        <div class="field"><label for="ubicacion_fisica">Kokapen fisikoa</label>
          <input type="text" id="ubicacion_fisica" placeholder="Adib. 2. solairua"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Gorde</button>
          <button type="button" class="btn btn-ghost" id="btnCancelarGela">Utzi</button>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/validate.js"></script>
<script src="js/gelas.js"></script>
</body>
</html>
