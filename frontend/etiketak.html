<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etiketak — Inbentarioa</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/toast.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="tag">INV-01</span><h1>Inbentarioa</h1></div>
    <nav class="nav">
      <a href="index.html">Ekipamendua</a>
      <a href="etiketak.html" class="active">Etiketak</a>
      <a href="gelak.html">Gelak</a>
      <a href="erosketak.html">Erosketak</a>
      <a href="erabiltzaileak.html" id="navErabiltzaileak" hidden>Erabiltzaileak</a>
    </nav>
    <div class="user-box" id="userBox">
      <strong id="userName">—</strong>
      <span class="role-badge" id="userRole">—</span>
      <p style="margin-top:10px"><a href="#" id="logoutLink">Saioa itxi</a></p>
    </div>
  </aside>

  <main>
    <!-- 1. IKUSPEGIA: ZERRENDA -->
    <div id="zerrendaIkuspegia">
      <div class="page-head">
        <div><h2>Etiketak / Gailuak</h2><p>Inbentariatutako unitateak eta haien uneko gela</p></div>
        <button type="button" class="btn btn-amber" id="btnEtiketaBerria">+ Unitatea inbentariatu</button>
      </div>

      <table class="inventory">
        <thead>
          <tr><th>Etiketa</th><th>Ekipoa</th><th>Gela (Kokapena)</th><th>Erregistro data</th><th>Akzioak</th></tr>
        </thead>
        <tbody id="tbodyEtiketak">
          <tr><td colspan="5" style="color:var(--text-mute)">Kargatzen…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 2. IKUSPEGIA: INPRIMAKIA -->
    <div id="inprimakiIkuspegia" hidden>
      <div class="page-head">
        <div><h2>Unitate berria</h2><p>Inbentariatutako unitateak eta haien uneko gela</p></div>
      </div>
      <div class="form-card" id="formEtiketa">
        <form id="etiketaForm" novalidate>
          <div class="field"><label for="kodea">Etiketaren kodea *</label><input type="text" id="kodea" required></div>
          <div class="field"><label for="baliabideId">Ekipo mota *</label><select id="baliabideId" required></select></div>
          <div class="field"><label for="gelaId">Hasierako gela *</label><select id="gelaId" required></select></div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Gorde</button>
            <button type="button" class="btn btn-ghost" id="btnUtzi">Utzi</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="js/base.js"></script>
<script src="js/api.js"></script>
<script src="js/validate.js"></script>
<script src="js/etiketak.js"></script>
</body>
</html>
