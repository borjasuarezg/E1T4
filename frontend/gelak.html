<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelak — Inbentarioa</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/base.js"></script>
<script src="js/toast.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="tag">INV-01</span><h1>Inbentarioa</h1></div>
    <nav class="nav">
      <a href="index.html">Ekipamendua</a>
      <a href="etiketak.html">Etiketak</a>
      <a href="gelak.html" class="active">Gelak</a>
      <a href="erosketak.html">Erosketak</a>
      <a href="erabiltzaileak.html" id="navErabiltzaileak" hidden>Erabiltzaileak</a>
    </nav>
    <div class="user-box" id="userBox">
      <strong id="userName">—</strong>
      <span class="role-badge" id="userRole">—</span>
      <p style="margin-top:10px"><a href="#" id="logoutLink">Saioa itxi</a></p>
    </div>
  </aside>

  <main>
    <!-- 1. IKUSPEGIA: ZERRENDA -->
    <div id="zerrendaIkuspegia">
      <div class="page-head">
        <div><h2>Gelak</h2><p>Ikasgelak eta espazioak</p></div>
        <button type="button" class="btn btn-amber" id="btnGelaBerria">+ Gela berria</button>
      </div>

      <table class="inventory">
        <thead><tr><th>Izena</th><th>Taldea</th><th>Akzioak</th></tr></thead>
        <tbody id="tbodyGelak"><tr><td colspan="3" style="color:var(--text-mute)">Kargatzen…</td></tr></tbody>
      </table>
    </div>

    <!-- 2. IKUSPEGIA: INPRIMAKIA -->
    <div id="inprimakiIkuspegia" hidden>
      <div class="page-head">
        <div><h2>Gela berria</h2><p>Ikasgelak eta espazioak</p></div>
      </div>
      <div class="form-card" id="formGela">
        <form id="gelaForm" novalidate>
          <div class="field"><label for="izena">Izena *</label><input type="text" id="izena" required></div>
          <div class="field"><label for="taldea">Taldea</label><input type="text" id="taldea"></div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Gorde</button>
            <button type="button" class="btn btn-ghost" id="btnUtzi">Utzi</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/validate.js"></script>
<script src="js/gelak.js"></script>
</body>
</html>
