<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekipamendua — Inbentarioa</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/toast.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="tag">INV-01</span><h1>Inbentarioa</h1></div>
    <nav class="nav">
      <a href="index.html" class="active">Ekipamendua</a>
      <a href="etiquetas.html">Etiketak</a>
      <a href="gelas.html">Gelak</a>
      <a href="compras.html">Erosketak</a>
      <a href="usuarios.html" id="navUsuarios" hidden>Erabiltzaileak</a>
    </nav>
    <div class="user-box" id="userBox">
      <strong id="userName">—</strong>
      <span class="role-badge" id="userRole">—</span>
      <p style="margin-top:10px"><a href="#" id="logoutLink">Saioa itxi</a></p>
    </div>
  </aside>

  <main>
    <div class="page-head">
      <div><h2>Ekipamendua</h2><p>Mintegiko materialaren katalogoa eta stock-a</p></div>
      <button type="button" class="btn btn-amber" id="btnNuevo">+ Ekipo berria</button>
    </div>

    <table class="inventory">
      <thead>
        <tr><th>Izena</th><th>Marka / Modeloa</th><th>Kategoria</th><th>Stock (Gailuak)</th><th>Akzioak</th></tr>
      </thead>
      <tbody id="tbodyEquipos">
        <tr><td colspan="5" style="color:var(--text-mute)">Kargatzen…</td></tr>
      </tbody>
    </table>

    <div class="form-card" id="formEquipo" style="display:none; margin-top:24px;">
      <h3 id="formTitulo" style="margin-top:0">Ekipo berria</h3>
      <form id="equipoForm" novalidate>
        <input type="hidden" id="equipoId">
        <div class="field">
          <label for="nombre">Izena *</label>
          <input type="text" id="nombre" required>
          <div class="error">Izena beharrezkoa da.</div>
        </div>
        <div class="field"><label for="marca">Marka</label><input type="text" id="marca"></div>
        <div class="field"><label for="modelo">Modeloa</label><input type="text" id="modelo"></div>
        <div class="field">
          <label for="categoria_id">Kategoria *</label>
          <select id="categoria_id" required></select>
          <div class="error">Kategoria bat aukeratu behar duzu.</div>
        </div>
        <div class="field"><label for="descripcion">Deskribapena</label><textarea id="descripcion" rows="3"></textarea></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Gorde</button>
          <button type="button" class="btn btn-ghost" id="btnCancelar">Utzi</button>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="js/base.js"></script>
<script src="js/api.js"></script>
<script src="js/equipos.js"></script>
</body>
</html>
