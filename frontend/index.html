<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekipamendua — Inbentarioa</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/toast.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="tag">INV-01</span><h1>Inbentarioa</h1></div>
    <nav class="nav">
      <a href="index.html" class="active">Ekipamendua</a>
      <a href="etiketak.html">Etiketak</a>
      <a href="gelak.html">Gelak</a>
      <a href="erosketak.html">Erosketak</a>
      <a href="erabiltzaileak.html" id="navErabiltzaileak" hidden>Erabiltzaileak</a>
    </nav>
    <div class="user-box" id="userBox">
      <strong id="userName">—</strong>
      <span class="role-badge" id="userRole">—</span>
      <p style="margin-top:10px"><a href="#" id="logoutLink">Saioa itxi</a></p>
    </div>
  </aside>

  <main>
    <!-- 1. IKUSPEGIA: ZERRENDA -->
    <div id="zerrendaIkuspegia">
      <div class="page-head">
        <div><h2>Ekipamendua</h2><p>Mintegiko materialaren katalogoa eta stock-a</p></div>
        <button type="button" class="btn btn-amber" id="btnBerria">+ Ekipo berria</button>
      </div>

      <table class="inventory">
        <thead>
          <tr><th>Izena</th><th>Marka / Modeloa</th><th>Kategoria</th><th>Stock (Gailuak)</th><th>Akzioak</th></tr>
        </thead>
        <tbody id="tbodyEkipamenduak">
          <tr><td colspan="5" style="color:var(--text-mute)">Kargatzen…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 2. IKUSPEGIA: INPRIMAKIA -->
    <div id="inprimakiIkuspegia" hidden>
      <div class="page-head">
        <div><h2 id="formTitulua">Ekipo berria</h2><p>Mintegiko materialaren katalogoa eta stock-a</p></div>
      </div>
      <div class="form-card" id="formEkipamendua">
        <form id="ekipamenduForm" novalidate>
          <input type="hidden" id="ekipamenduId">
          <div class="field"><label for="izena">Izena *</label><input type="text" id="izena" required></div>
          <div class="field"><label for="marka">Marka</label><input type="text" id="marka"></div>
          <div class="field"><label for="modeloa">Modeloa</label><input type="text" id="modeloa"></div>
          <div class="field"><label for="kategoriaId">Kategoria *</label><select id="kategoriaId" required></select></div>
          <div class="field"><label for="deskribapena">Deskribapena</label><textarea id="deskribapena" rows="3"></textarea></div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Gorde</button>
            <button type="button" class="btn btn-ghost" id="btnUtzi">Utzi</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="js/base.js"></script>
<script src="js/api.js"></script>
<script src="js/ekipamenduak.js"></script>
</body>
</html>
