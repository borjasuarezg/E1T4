<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erabiltzaileak — Inbentarioa</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/base.js"></script>
<script src="js/toast.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="tag">INV-01</span><h1>Inbentarioa</h1></div>
    <nav class="nav">
      <a href="index.html">Ekipamendua</a>
      <a href="etiketak.html">Etiketak</a>
      <a href="gelak.html">Gelak</a>
      <a href="erosketak.html">Erosketak</a>
      <a href="erabiltzaileak.html" class="active">Erabiltzaileak</a>
    </nav>
    <div class="user-box" id="userBox">
      <strong id="userName">—</strong>
      <span class="role-badge" id="userRole">—</span>
      <p style="margin-top:10px"><a href="#" id="logoutLink">Saioa itxi</a></p>
    </div>
  </aside>

  <main>
    <!-- 1. IKUSPEGIA: ZERRENDA -->
    <div id="zerrendaIkuspegia">
      <div class="page-head">
        <div><h2>Erabiltzaileak</h2><p>Administratzaileak soilik</p></div>
        <button type="button" class="btn btn-amber" id="btnErabiltzaileBerria">+ Erabiltzaile berria</button>
      </div>

      <table class="inventory">
        <thead><tr><th>Erabiltzailea</th><th>Rola</th></tr></thead>
        <tbody id="tbodyErabiltzaileak"><tr><td colspan="2" style="color:var(--text-mute)">Kargatzen…</td></tr></tbody>
      </table>
    </div>

    <!-- 2. IKUSPEGIA: INPRIMAKIA -->
    <div id="inprimakiIkuspegia" hidden>
      <div class="page-head">
        <div><h2>Erabiltzaile berria</h2><p>Administratzaileak soilik</p></div>
      </div>
      <div class="form-card" id="formErabiltzailea">
        <form id="erabiltzaileForm" novalidate>
          <div class="field"><label for="username">Erabiltzaile-izena *</label><input type="text" id="username" required></div>
          <div class="field"><label for="password">Pasahitza *</label><input type="password" id="password" required minlength="8"></div>
          <div class="field"><label for="rol">Rola</label>
            <select id="rol"><option value="teknikaria">teknikaria</option><option value="admin">admin</option></select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Gorde</button>
            <button type="button" class="btn btn-ghost" id="btnUtzi">Utzi</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/validate.js"></script>
<script src="js/erabiltzaileak.js"></script>
</body>
</html>
