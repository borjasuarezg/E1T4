<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saioa hasi — Inbentarioa</title>
<link rel="stylesheet" href="css/style.css">
    <script src="js/base.js"></script><script src="js/toast.js" defer></script>
</head>
<body>
<div class="login-screen">
  <div class="login-panel">
    <span class="tag">INV-01</span>
    <h1>Mintegiko inbentarioa</h1>

    <div class="login-error" id="loginError" style="display:none; color: red; margin-bottom: 12px;"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Erabiltzailea</label>
        <input type="text" id="username" required>
      </div>

      <div class="field">
        <label for="password">Pasahitza</label>
        <input type="password" id="password" required minlength="8">
      </div>

      <div class="form-actions" style="margin-top:16px;">
        <button type="submit" class="btn btn-amber">Sartu</button>
      </div>
    </form>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/validate.js"></script>
<script src="js/login.js"></script>
</body>
</html>
